[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokerbots"
version = "0.1.0"
description = "AC2 project for the Vals poker event (an empty stub: everything runs in the harness)."
requires-python = ">=3.12"
# Nothing here runs inside AC2: the self-hosted harness (harness/) plays and grades every hand. AC2 still installs
# this project's wheel and needs a project version for training, so it stays dependency-free.
dependencies = []

[dependency-groups]
dev = ["ac2>=0.3.97", "pytest>=8.0.0"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pokerbots"]

[[tool.uv.index]]
name = "ac2"
url = "https://api.appliedcompute.com/v1/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true

[tool.uv.sources]
ac2 = { index = "ac2" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ac2]
