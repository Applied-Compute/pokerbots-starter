[project]
name = "poker-harness"
version = "0.1.0"
description = "Self-hosted AC2 harness for 6-max no-limit hold'em on Vals' poker engine: one hand per rollout, harness-side grading."
requires-python = ">=3.12"
dependencies = [
    "poker-agent-benchmark-service",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

# Vals' hand engine is not on PyPI. Put the copy Vals gives you at vendor/poker-agent, or point this at the git URL
# Vals grants you access to.
[tool.uv.sources]
poker-agent-benchmark-service = { path = "vendor/poker-agent", editable = true }

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24", "ruff>=0.14.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_harness"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
