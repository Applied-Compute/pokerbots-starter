[project]
name = "poker-harness"
version = "0.1.0"
description = "Self-hosted AC2 harness for 6-max no-limit hold'em: one game per rollout, harness-side grading."
requires-python = ">=3.12"
dependencies = [
    "pokerkit>=0.7.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24", "ruff>=0.14.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_harness"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"
